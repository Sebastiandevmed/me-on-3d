<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Avatar preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px -apple-system,Helvetica,sans-serif;color:#ddd}
  canvas{display:block}
  #ui{position:fixed;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
  button{background:#111;color:#eee;border:1px solid #333;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
  button:hover{border-color:#3b82f6}
  button:disabled{opacity:.4;cursor:default}
  #help{position:fixed;left:12px;bottom:12px;opacity:.6;max-width:60vw;line-height:1.5}
  #info{position:fixed;right:12px;bottom:12px;opacity:.8;text-align:right;line-height:1.5;white-space:pre}
  #err{position:fixed;right:12px;top:12px;max-width:50vw;color:#ff6b6b;background:rgba(40,0,0,.7);padding:6px 10px;border-radius:8px;white-space:pre-wrap;font:12px Menlo,monospace;display:none;z-index:3}
</style>
<script>
  // Errores visibles en pantalla (también en la captura headless).
  window.__errors = [];
  const showErr = (m) => { window.__errors.push(m); const e = document.getElementById('err'); if (e) { e.style.display = 'block'; e.textContent = window.__errors.join('\n'); } };
  window.addEventListener('error', (ev) => { const res = ev.target && (ev.target.src || ev.target.href); showErr('error: ' + (ev.message || ev.type) + (ev.filename ? ' @ ' + ev.filename.split('/').pop() + ':' + ev.lineno : '') + (res ? ' [' + res + ']' : '')); }, true);
  window.addEventListener('unhandledrejection', (ev) => showErr('unhandled: ' + (ev.reason && ev.reason.message || ev.reason)));
  const _ce = console.error.bind(console); console.error = (...a) => { showErr('console.error: ' + a.map(String).join(' ')); _ce(...a); };
  const _cw = console.warn.bind(console); console.warn = (...a) => { showErr('console.warn: ' + a.map(String).join(' ')); _cw(...a); };
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<div id="ui">
  <button data-clip="vibe" disabled>vibe</button>
  <button data-clip="browup" disabled>browup</button>
  <button data-clip="lookAround" disabled>lookAround</button>
  <button data-clip="introAnimation" disabled>intro</button>
  <button id="resetCam">reset camera</button>
</div>
<div id="err"></div>
<div id="help">Arrastra para orbitar, rueda para zoom. La cabeza mira al cursor. Clic sobre el personaje = vibe (se pone los audífonos y cabecea; también automático cada 30-50 s).</div>
<div id="info">cargando…</div>
<script type="module">
// Arnés de depuración. Todo el motor vive en lib/scene.js; aquí solo quedan el panel de estado,
// los botones de clip y las variantes ?mat= (que son puro diagnóstico de textura).
//
// Contrato con tools/preview_probe.mjs: window.__status / __view / __vibe / __inkFrac.
import * as THREE from 'three';
import { createAvatarScene } from './lib/scene.js';

const Q = new URLSearchParams(location.search);
const info = document.getElementById('info');

const av = createAvatarScene({ query: Q, bustCache: true, onReady: (api) => {
  document.querySelectorAll('button[data-clip]').forEach(b => {
    b.disabled = !api.actions[b.dataset.clip];
    b.onclick = () => { const n = b.dataset.clip; if (n === 'browup') api.browup(); else api.playExclusive(n); };
  });
  applyMatVariant(api);
} });

window.__status = av.status;
window.__view = { camera: av.camera, controls: av.controls, THREE, follow: () => av.follow, browup: () => av.browup(), mouse: av.mouse };
window.__vibe = () => av.vibe();
window.__inkFrac = () => av.inkFrac();

document.getElementById('resetCam').onclick = () => av.resetCamera();

let last = 0;
av.onFrame(() => {
  const now = performance.now();
  if (now - last < 500) return;
  last = now;
  info.textContent = (av.status.loaded ? 'glb ok' : 'cargando glb…') + ' · hdr ' + (av.status.env ? 'ok' : '…') + ' · ' + av.status.fps + ' fps'
    + '\nclips: ' + av.status.clips() + (av.status.exclusive ? '\nexclusivo: ' + av.status.exclusive : '');
});

// ?mat= variante de material del personaje (para comparar capturas con la sonda):
//   basic  = la TEXTURA tal cual, sin luz ni bandas. Es el único modo que separa "la textura
//            está mal pintada" de "el cel-shading la está aplastando". EMPEZAR SIEMPRE POR AHÍ.
//   front  = solo cara frontal (la malla de Meshy son islas con bordes que no coinciden; con
//            doubleSided el interior iluminado asoma por las rendijas como vetas claras)
//   flat   = front + rugosidad 1 y sin reflejo del entorno (look más plano, tipo cartoon)
//   toon   = front + MeshToonMaterial con la misma textura (sombreado por escalones)
//   nomap / nomip / maxlodN = pruebas de mipmap y de textura, de la sesión 5
function applyMatVariant(api) {
  const MAT = Q.get('mat');
  const character = api.character;
  if (!character || !MAT) return;
  const old = character.material, renderer = api.renderer;
  if (MAT.startsWith('maxlod')) {   // maxlod2 / maxlod3: tope de nivel de mipmap por GL crudo (WebGL2 TEXTURE_MAX_LOD)
    const lod = parseInt(MAT.slice(6)), tex = old.map;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    renderer.initTexture(tex);
    const gl = renderer.getContext(), wt = renderer.properties.get(tex).__webglTexture;
    gl.bindTexture(gl.TEXTURE_2D, wt); gl.texParameterf(gl.TEXTURE_2D, gl.TEXTURE_MAX_LOD, lod); gl.bindTexture(gl.TEXTURE_2D, null);
  }
  else if (MAT === 'nomap') { character.material = old.clone(); character.material.map = null; character.material.color.set(0x606060); }
  else if (MAT === 'nomip') { character.material = old.clone(); character.material.map = old.map.clone(); character.material.map.generateMipmaps = false; character.material.map.minFilter = THREE.LinearFilter; character.material.map.needsUpdate = true; }
  else if (MAT === 'toon') { character.material = new THREE.MeshToonMaterial({ map: old.map, side: THREE.FrontSide }); }
  else if (MAT === 'basic') { character.material = new THREE.MeshBasicMaterial({ map: old.map, side: THREE.FrontSide }); }
  else { character.material = old.clone(); character.material.side = THREE.FrontSide; if (MAT === 'flat') { character.material.roughness = 1; character.material.envMapIntensity = 0.15; } }
}
</script></body></html>
